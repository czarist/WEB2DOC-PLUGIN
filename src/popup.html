<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Web2Doc</title>
    <style>
        :root {
            --bg: #ffffff;
            --surface-hover: #f2f4f7;
            --surface-active: #e8ebf0;
            --text: #16181d;
            --text-muted: #5b6270;
            --border: #e3e6eb;
            --accent: #1f5bd8;
            --accent-soft: #e8effc;
            --success: #17794a;
            --success-soft: #e6f4ec;
            --error: #b42318;
            --error-soft: #fdecea;
            --focus: #1f5bd8;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1d1f24;
                --surface-hover: #282b31;
                --surface-active: #30343b;
                --text: #eceef2;
                --text-muted: #a3a9b5;
                --border: #33363d;
                --accent: #8cb0ff;
                --accent-soft: #263552;
                --success: #6fd69c;
                --success-soft: #1d3a2b;
                --error: #ff9c90;
                --error-soft: #48231f;
                --focus: #8cb0ff;
            }
        }

        * {
            box-sizing: border-box;
        }

        ::selection {
            background: var(--accent-soft);
            color: var(--text);
        }

        body {
            width: 320px;
            margin: 0;
            padding: 16px 12px 12px;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 4px 14px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 8px;
        }

        header img {
            width: 28px;
            height: 28px;
            flex: none;
        }

        h1 {
            margin: 0;
            font-size: 15px;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        header p {
            margin: 1px 0 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        .actions {
            display: grid;
            gap: 2px;
        }

        .action {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 8px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
            transition: background-color 120ms ease-out;
        }

        .action:hover:not(:disabled) {
            background: var(--surface-hover);
        }

        .action:active:not(:disabled) {
            background: var(--surface-active);
        }

        .action:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: -2px;
        }

        .action:disabled {
            cursor: progress;
            opacity: 0.55;
        }

        .action-icon {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            flex: none;
            border-radius: 8px;
            background: var(--accent-soft);
            color: var(--accent);
        }

        .action-icon svg {
            width: 18px;
            height: 18px;
        }

        .action-title {
            display: block;
            font-weight: 600;
        }

        .action-detail {
            display: block;
            margin-top: 1px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .status {
            margin: 8px 0 0;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--surface-hover);
        }

        .status:empty {
            display: none;
        }

        .status[data-state="success"] {
            color: var(--success);
            background: var(--success-soft);
        }

        .status[data-state="error"] {
            color: var(--error);
            background: var(--error-soft);
        }

        [hidden] {
            display: none !important;
        }

        .picker-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 0 12px;
            border-bottom: 1px solid var(--border);
        }

        h2 {
            outline: none;
            margin: 0;
            font-size: 15px;
            font-weight: 650;
            letter-spacing: -0.01em;
        }

        .picker-header p {
            margin: 1px 0 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        .icon-button {
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            flex: none;
            padding: 0;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
        }

        .icon-button svg {
            width: 18px;
            height: 18px;
        }

        .icon-button:hover {
            background: var(--surface-hover);
        }

        .table-list {
            max-height: 330px;
            margin: 0;
            padding: 6px 0;
            overflow-y: auto;
            list-style: none;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }

        .table-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 120ms ease-out;
        }

        .table-item:hover,
        .table-item:focus-within {
            background: var(--surface-hover);
        }

        .table-item input {
            width: 16px;
            height: 16px;
            margin: 2px 0 0;
            flex: none;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .table-item input:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        .table-number {
            display: grid;
            place-items: center;
            min-width: 22px;
            height: 20px;
            padding: 0 5px;
            flex: none;
            border: 1.5px solid var(--accent);
            border-radius: 10px;
            color: var(--accent);
            font-size: 11px;
            font-weight: 650;
            font-variant-numeric: tabular-nums;
        }

        .table-item:has(input:checked) .table-number {
            background: var(--accent);
            color: var(--bg);
        }

        .table-text {
            min-width: 0;
        }

        .table-title {
            display: block;
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .table-meta,
        .table-preview {
            display: block;
            margin-top: 1px;
            color: var(--text-muted);
            font-size: 12px;
        }

        .table-meta {
            font-variant-numeric: tabular-nums;
        }

        .table-preview {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .picker-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .text-button,
        .primary-button {
            height: 32px;
            padding: 0 12px;
            border: 0;
            border-radius: 8px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .text-button {
            background: transparent;
            color: var(--accent);
        }

        .text-button:hover {
            background: var(--accent-soft);
        }

        .primary-button {
            background: var(--accent);
            color: var(--bg);
        }

        .primary-button:hover:not(:disabled) {
            filter: brightness(1.08);
        }

        .primary-button:disabled {
            background: var(--surface-active);
            color: var(--text-muted);
            cursor: default;
        }

        .text-button:focus-visible,
        .primary-button:focus-visible,
        .icon-button:focus-visible {
            outline: 2px solid var(--focus);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            .action,
            .table-item {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <section id="mainView">
    <header>
        <img src="icons/icon-128.png" alt="">
        <div>
            <h1>Web2Doc</h1>
            <p>Save this page's content as a file.</p>
        </div>
    </header>

    <div class="actions">
        <button class="action" id="exportCSV" type="button">
            <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3.5" y="4.5" width="17" height="15" rx="2"/>
                    <path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/>
                </svg>
            </span>
            <span>
                <span class="action-title">Export tables to CSV</span>
                <span class="action-detail">Choose which tables to download</span>
            </span>
        </button>

        <button class="action" id="exportPDF" type="button">
            <span class="action-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 8.5V3.5h10v5"/>
                    <rect x="3.5" y="8.5" width="17" height="8" rx="2"/>
                    <path d="M7 14h10v6.5H7z"/>
                </svg>
            </span>
            <span>
                <span class="action-title">Save page as PDF</span>
                <span class="action-detail">Captures the full page with styles and links</span>
            </span>
        </button>
    </div>
    </section>

    <section id="tablesView" class="picker" hidden aria-labelledby="pickerTitle">
        <div class="picker-header">
            <button class="icon-button" id="pickerBack" type="button" aria-label="Back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M15 5l-7 7 7 7"/>
                </svg>
            </button>
            <div>
                <h2 id="pickerTitle" tabindex="-1">Choose tables</h2>
                <p id="pickerSummary"></p>
            </div>
        </div>

        <ul class="table-list" id="tableList"></ul>

        <div class="picker-footer">
            <button class="text-button" id="toggleAllTables" type="button">Select all</button>
            <button class="primary-button" id="exportSelectedTables" type="button" disabled>Select tables</button>
        </div>
    </section>

    <p class="status" id="exportStatus" role="status" aria-live="polite"></p>

    <script src="popup.js"></script>
</body>

</html>
